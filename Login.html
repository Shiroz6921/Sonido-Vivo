<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonido Vivo - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="login-card p-4 p-md-5 shadow-lg">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold fs-2 mb-1">Sonido<span class="texto-amarillo">Vivo</span></h2>
            <p class="texto-muted">Ingresa a tu cuenta</p>
        </div>
        
        <form id="formulario-login" onsubmit="event.preventDefault(); ingresar();">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico:</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="admin@sonidovivo.cl" required>
            </div>
            
            <div class="mb-4">
                <label for="clave" class="form-label">Contraseña:</label>
                <input type="password" class="form-control" id="clave" name="clave" placeholder="****" required>
            </div>
            
            <button type="submit" class="btn btn-accent w-100 py-2">Iniciar Sesión</button>
            <br>
            <p class="text-center texto-muted"> cliente@sonidovivo.cl </p>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
