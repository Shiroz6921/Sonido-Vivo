<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonido Vivo - Tienda de Instrumentos Musicales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Style.css">  
</head>
<body>
    
    <div id="app-contenido">
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark py-3">
                <div class="container-fluid">
                    
                    <a class="navbar-brand fw-bold fs-3" href="Index.html">Sonido<span>Vivo</span></a>
                    
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Navegación">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                            <li class="nav-item mx-2">
                                <a class="nav-link text-uppercase" href="Instrumentos.html">Instrumentos</a>
                            </li>
                            <li class="nav-item mx-2">
                                <a class="nav-link text-uppercase" href="Accesorios.html">Accesorios</a>
                            </li>
                            <li class="nav-item mx-2">
                                <a class="nav-link text-uppercase" href="Ofertas.html">Ofertas</a>
                            </li>
                            <li class="nav-item mx-2">
                                <a class="nav-link text-uppercase" href="Contacto.html">Contacto</a>
                            </li>
                            
                            <li class="nav-item ms-lg-4 mt-3 mt-lg-0">
                                <a class="btn btn-accent px-4 rounded-pill" href="Login.html">Cerrar Sesión</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
    </div>
    <div class="container mt-4 mb-5">
            <div id="carruselOfertas" class="carousel slide shadow-lg" data-bs-ride="carousel" data-bs-interval="4000">
                
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carruselOfertas" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carruselOfertas" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carruselOfertas" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>

                <div class="carousel-inner borde-carrusel">
                    
                    <div class="carousel-item active">
                        <img src="Imagenes/carrusel1.webp" class="d-block w-100" alt="Banner 1">
                    </div>
                    
                    <div class="carousel-item">
                        <img src="Imagenes/carrusel2.webp" class="d-block w-100" alt="Banner 2">
                    </div>
                    
                    <div class="carousel-item">
                        <img src="Imagenes/carrusel3.webp" class="d-block w-100" alt="Banner 3">
                    </div>

                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carruselOfertas" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                
                <button class="carousel-control-next" type="button" data-bs-target="#carruselOfertas" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
    </div>

    <script src="js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>  
</body>
</html>
